- name: Cache
  uses: actions/cache@v5.1.0
  with:
    # A list of files, directories, and wildcard patterns to cache and restore
    path: 
    # An explicit key for restoring and saving the cache
    key: 
    # An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.
    restore-keys: # optional
    # The chunk size used to split up large files during upload, in bytes
    upload-chunk-size: # optional
    # An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms
    enableCrossOsArchive: # optional, default is false
    # Fail the workflow if cache entry is not found
    fail-on-cache-miss: # optional, default is false
    # Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache
    lookup-only: # optional, default is false
    # Run the post step to save the cache even if another step before fails
    save-always: # optional, default is false

    
    
    - run: npm install sharp



    - name: Elide Format
  # You may pin to the exact commit or the version.
  # uses: elide-dev/format@aae4b4e776ae3ef91a609b7d7e1cf6864a6e6fe8
  uses: elide-dev/format@v1.1.3
  with:
    # Formatter to run: javaformat, ktfmt, or all
    formatter: # optional, default is all
    # Mode: check (default) or write
    mode: # optional, default is check
    # Files or directories to check (space or newline-separated paths). When omitted, sources are auto-detected by extension (*.java for javaformat, *.kt for ktfmt).

    files: # optional
    # Directory to run formatters from
    working-directory: # optional, default is ${{ github.workspace }}
    # Files or patterns to exclude (space or newline-separated). Plain paths are matched as path segments; glob patterns (* and **) are also supported.

    exclude: # optional
    # Extra arguments for google-java-format (appended after --)
    gjf-args: # optional
    # Extra arguments for ktfmt (appended after --)
    ktfmt-args: # optional
    # Include .kts (Kotlin script) files when running ktfmt
    include-kts: # optional, default is false
    # Fail the workflow when formatting check fails
    fail-on-error: # optional, default is true
    # Enable anonymous error telemetry
    telemetry: # optional, default is true
    # Output mode after the formatter runs: none (default), file (print affected file paths), diff (print unified diffs, check mode only), or command (print a fix command).

    output-mode: # optional, default is none
    # When output-mode is diff, limit the number of files whose diffs are printed. If the number of affected files exceeds this limit, falls back to listing file paths instead. Must be a positive integer.

    output-mode-diffs: # optional
    # When output-mode is command, print this string instead of a generated elide command. Intended for projects that have a pre-defined formatter command (e.g. a Makefile target).

    output-mode-command: # optional
